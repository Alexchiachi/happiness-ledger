name: Process Happiness Record

on:
  issues:
    # 只監聽 opened。GitHub 對「建立時即帶標籤」的 Issue 會同時送出 opened 與
    # labeled 兩個事件，兩者都收會讓同一筆存入觸發兩個 job 互相搶著 push。
    types: [opened]
  workflow_dispatch: # 支援手動一鍵點擊執行

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# 刻意不使用 concurrency 群組：GitHub 在同一群組中只保留最新一個排隊的 run，
# 更早排隊的會被取消，等於在高併發時直接丟棄紀錄。改以下方的重試迴圈處理競爭。

jobs:
  archive-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write Record and Push (with retry)
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "── 第 ${attempt} 次嘗試 ──"

            # 每次都重置到最新的遠端狀態後重算，避免以過時的 ledger.json 為基礎。
            # 不用 rebase：兩個並行的 run 都會整份重寫 ledger.json，必然衝突。
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD

            node .github/scripts/update-ledger.js

            git add data/
            if git diff --staged --quiet; then
              echo "沒有變更（此紀錄已存在），視為成功。"
              exit 0
            fi

            git commit -m "feat(ledger): 自動存入幸福紀錄 #${{ github.event.issue.number }}"

            if git push origin HEAD:main; then
              echo "已成功推送。"
              exit 0
            fi

            echo "推送被拒（其他紀錄先寫入），稍後重試。"
            sleep $(( (RANDOM % 5) + attempt * 3 ))
          done

          echo "::error::連續 8 次推送皆失敗，紀錄未寫入帳本。"
          exit 1

      - name: Close Issue with Blessings
        if: github.event.issue.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✨ 您的幸福感知已成功鐫刻於開源記帳本中。感謝您為這個世界點亮微光！'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
