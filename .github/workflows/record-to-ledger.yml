name: Process Happiness Record

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch: # 支援手動一鍵點擊執行

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  archive-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Issue and Update Ledger
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 取得 Issue 內容
            const issue = context.payload.issue;
            if (!issue) return;

            const body = issue.body || '';
            const issueNumber = issue.number;
            const dateStr = new Date().toISOString();

            // 解析各欄位
            const extractSection = (heading) => {
              const regex = new RegExp(`### ${heading}[\\s\\S]*?\\n([\\s\\S]*?)(?=###|$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            };

            const nickname = extractSection('您的稱呼 / 筆名') || extractSection('您的稱呼') || extractSection('Your Name / Moniker') || issue.user?.login || '匿名旅人';
            const category = extractSection('幸福微類型') || extractSection('Micro-Category') || '✨ 幸福微光';
            const content = extractSection('幸福感知內容') || extractSection('Your Moment of Awareness') || body || '無感知內容';

            // 確保 data 資料夾存在
            const dataDir = path.join(process.env.GITHUB_WORKSPACE, 'data');
            const recordDir = path.join(dataDir, 'records');
            if (!fs.existsSync(recordDir)) fs.mkdirSync(recordDir, { recursive: true });

            // 寫入個別 Markdown
            const fileName = `${dateStr.split('T')[0]}-record-${issueNumber}.md`;
            const mdContent = `---\nid: ${issueNumber}\ndate: ${dateStr}\nauthor: "${nickname}"\ncategory: "${category}"\n---\n\n${content}\n`;
            fs.writeFileSync(path.join(recordDir, fileName), mdContent, 'utf8');

            // 讀取並更新 ledger.json
            const jsonPath = path.join(dataDir, 'ledger.json');
            let ledger = [];
            if (fs.existsSync(jsonPath)) {
              try {
                ledger = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              } catch (e) {
                ledger = [];
              }
            }

            // 避免重複寫入同一個 Issue ID
            ledger = ledger.filter(item => item.id !== issueNumber);
            ledger.unshift({
              id: issueNumber,
              date: dateStr,
              author: nickname,
              category: category,
              content: content
            });

            fs.writeFileSync(jsonPath, JSON.stringify(ledger, null, 2), 'utf8');

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "feat(ledger): 自動存入幸福紀錄 #${{ github.event.issue.number }}"
          git push origin main

      - name: Close Issue with Blessings
        if: github.event.issue.state == 'open'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✨ 您的幸福感知已成功鐫刻於開源記帳本中。感謝您為這個世界點亮微光！'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
